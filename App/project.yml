# XcodeGen project definition. Generate the Xcode project with:
#
#   brew install xcodegen
#   cd App && xcodegen generate
#
# The .xcodeproj is deliberately not committed; this file is the source of truth.
name: Proportion

options:
  bundleIdPrefix: com.proportion
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  ProportionCore:
    path: ../ProportionCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Proportion:
    type: application
    platform: iOS
    sources:
      - path: Proportion
      - path: Shared
    dependencies:
      - package: ProportionCore
      - target: ProportionShare
        embed: true
    entitlements:
      path: Proportion/Proportion.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.proportion.app]
        com.apple.security.application-groups: [group.com.proportion.app]
        aps-environment: development
    info:
      path: Proportion/Info.plist
      properties:
        CFBundleDisplayName: Proportion
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Proportion uses the camera to photograph recipes so it can read the ingredients.
        NSPhotoLibraryUsageDescription: Proportion reads recipe photos and screenshots you choose so it can extract the ingredients.
        # Secrets are injected from Config/Secrets.xcconfig at build time.
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
        USDA_API_KEY: $(USDA_API_KEY)
        CLAUDE_MODEL: $(CLAUDE_MODEL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proportion.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    scheme:
      testTargets:
        - ProportionUITests
      gatherCoverageData: false

  ProportionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProportionUITests
    dependencies:
      - target: Proportion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proportion.app.uitests
        TEST_TARGET_NAME: Proportion

  ProportionShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ProportionShare
      - path: Shared
    dependencies:
      - package: ProportionCore
    entitlements:
      path: ProportionShare/ProportionShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.proportion.app]
    info:
      path: ProportionShare/Info.plist
      properties:
        CFBundleDisplayName: Save to Proportion
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proportion.app.share
